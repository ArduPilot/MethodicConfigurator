name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'  # Every Monday at 05:23 UTC

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  mutation:
    # Allow manual runs in forks, but avoid unattended weekly runs there.
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.fork
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 330

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Reserve time for mutation state and reports
        shell: bash
        run: echo "MUTATION_CUTOFF=$(( $(date +%s) + 305 * 60 ))" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Install dependencies
        run: uv pip install --editable '.[dev,mutation]'

      - name: Identify compatible mutation state
        id: mutation_state
        shell: bash
        run: |
          # Mutmut invalidates changed functions; do not partition state by source revision.
          mutmut_version=$(python -c 'from importlib.metadata import version; print(version("mutmut"))')
          state_name="mutmut-state-${RUNNER_OS}-py311-v3-${mutmut_version}"
          echo "cache_prefix=${state_name}-" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${state_name}" >> "$GITHUB_OUTPUT"
          # Existing v2 artifacts were produced with Mutmut 3.8.1.
          if [[ "$mutmut_version" == "3.8.1" ]]; then
            echo "legacy_artifact_prefix=mutmut-state-${RUNNER_OS}-py311-v2-" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p .cache/mutation
          # Include resolved transitive dependencies in Mutmut's invalidation checks.
          uv pip freeze | LC_ALL=C sort > .cache/mutation/dependencies.txt

      - name: Verify unmodified selected tests
        shell: bash
        run: |
          mkdir -p .cache/mutation
          xvfb-run -a python - <<'PY'
          import tomllib

          import pytest

          with open("pyproject.toml", "rb") as config_file:
              config = tomllib.load(config_file)["tool"]["mutmut"]
          raise SystemExit(pytest.main([
              *config["pytest_add_cli_args_test_selection"],
              *config["pytest_add_cli_args"],
              "--junit-xml=.cache/mutation/baseline.xml",
          ]))
          PY

      - name: Restore mutation state
        id: restore_mutation_state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mutants/**/*.meta
            mutants/mutmut-stats.json
          key: ${{ steps.mutation_state.outputs.cache_prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.mutation_state.outputs.cache_prefix }}

      - name: Find previous mutation artifact
        id: previous_mutation_artifact
        if: steps.restore_mutation_state.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ARTIFACT_NAME: ${{ steps.mutation_state.outputs.artifact_name }}
          LEGACY_ARTIFACT_PREFIX: ${{ steps.mutation_state.outputs.legacy_artifact_prefix }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def previous_artifacts():
              next_url = url
              while next_url:
                  with urlopen(Request(next_url, headers=headers), timeout=30) as response:
                      artifacts = json.load(response)["artifacts"]
                      next_url = response.headers.get("Link", "")
                  next_url = next((
                      link.split(";")[0].strip().strip("<>")
                      for link in next_url.split(",") if 'rel="next"' in link
                  ), None)
                  yield from artifacts

          for artifact in previous_artifacts():
              legacy_prefix = os.environ.get("LEGACY_ARTIFACT_PREFIX", "")
              if artifact["name"] != os.environ["STATE_ARTIFACT_NAME"] and not (
                  legacy_prefix and artifact["name"].startswith(legacy_prefix)
              ):
                  continue
              run = artifact.get("workflow_run") or {}
              if artifact["expired"] or run.get("head_branch") != os.environ["GITHUB_REF_NAME"]:
                  continue
              if str(run.get("id")) == os.environ["GITHUB_RUN_ID"]:
                  continue
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  print(f"artifact_id={artifact['id']}", file=output)
                  print(f"run_id={run['id']}", file=output)
              print(f"Found mutation state in artifact {artifact['id']} from run {run['id']}")
              break
          else:
              print("No previous mutation artifact is available; starting without saved state.")
          PY

      - name: Download previous mutation artifact
        if: steps.previous_mutation_artifact.outputs.artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.previous_mutation_artifact.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous_mutation_artifact.outputs.run_id }}
          path: ${{ runner.temp }}/mutation-previous

      - name: Restore mutation state from artifact
        if: steps.previous_mutation_artifact.outputs.artifact_id != ''
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          # The state-only artifact is rooted at the common upload ancestor: mutants/.
          source_root = Path(os.environ["RUNNER_TEMP"]) / "mutation-previous"
          state_files = (*source_root.rglob("*.meta"), source_root / "mutmut-stats.json")
          restored = 0
          for source in state_files:
              if source.is_file():
                  target = Path("mutants") / source.relative_to(source_root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  restored += 1
          print(f"Restored {restored} mutation state files from the previous artifact.")
          PY

      - name: Run mutation suite
        timeout-minutes: 310
        shell: bash
        run: |
          # Clean-test and framework failures fail this step.
          # Per-mutant survivors, timeouts, and crashes are reported for review.
          remaining=$(( MUTATION_CUTOFF - $(date +%s) ))
          if (( remaining <= 0 )); then
            echo "No time remains to run mutation tests before the CI cutoff."
            exit 1
          fi
          set +e
          timeout --signal=INT --kill-after=120s "${remaining}s" \
            xvfb-run -a mutmut run --max-children 2 | tee .cache/mutation/run.log
          statuses=( "${PIPESTATUS[@]}" )
          set -e
          if (( statuses[0] == 124 )); then
            echo "Mutation run stopped at the CI cutoff; completed results will be cached."
            exit "${statuses[1]}"
          fi
          if (( statuses[0] != 0 )); then
            exit "${statuses[0]}"
          fi
          exit "${statuses[1]}"

      - name: Discard incomplete mutation state files
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state_dir = Path("mutants")
          for path in (*state_dir.rglob("*.meta"), state_dir / "mutmut-stats.json"):
              if not path.is_file():
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, UnicodeDecodeError):
                  path.unlink()
                  print(f"Discarded incomplete mutation state: {path}")
          PY

      - name: Save mutation state
        if: always() && hashFiles('mutants/**/*.meta') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mutants/**/*.meta
            mutants/mutmut-stats.json
          key: ${{ steps.mutation_state.outputs.cache_prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation state
        if: always() && hashFiles('mutants/**/*.meta') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.mutation_state.outputs.artifact_name }}
          path: |
            mutants/**/*.meta
            mutants/mutmut-stats.json
          if-no-files-found: error
          retention-days: 15

      - name: Report mutation results
        if: always()
        shell: bash
        run: |
          if [ -d mutants ]; then
            mutmut results --all true | tee .cache/mutation/results.txt
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from collections import Counter, defaultdict
          from pathlib import Path

          counts = defaultdict(Counter)
          for line in Path(".cache/mutation/results.txt").read_text().splitlines():
              mutant, status = line.strip().rsplit(": ", 1)
              module = mutant.rsplit(".", 1)[0].removeprefix("ardupilot_methodic_configurator.")
              counts[module][status] += 1
          statuses = sorted({status for counts_by_status in counts.values() for status in counts_by_status})
          print("### Mutation testing\n")
          print("Survivors are reported for review; no mutation-score threshold is enforced yet.\n")
          print("| Module | " + " | ".join(statuses) + " |")
          print("| --- | " + " | ".join("---:" for _ in statuses) + " |")
          for module, counts_by_status in sorted(counts.items()):
              print(f"| `{module}` | " + " | ".join(str(counts_by_status[status]) for status in statuses) + " |")
          print("\nDownload the mutation artifact for individual results and execution logs.")
          PY
          fi

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-py311
          path: |
            .cache/mutation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 15
