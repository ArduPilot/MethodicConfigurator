name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'  # Every Monday at 05:23 UTC

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  mutation:
    # Allow manual runs in forks, but avoid unattended weekly runs there.
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.fork
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - backend
          - data-model
          - frontend
          - log-analysis-backend
          - log-analysis-data-model
          - log-analysis-frontend
          - plugins-backend
          - plugins-data-model
          - plugins-frontend

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Reserve time for mutation state and reports
        shell: bash
        run: |
          started_at=$(date +%s)
          echo "MUTATION_JOB_STARTED_AT=${started_at}" >> "$GITHUB_ENV"
          echo "MUTATION_CUTOFF=$(( started_at + 305 * 60 ))" >> "$GITHUB_ENV"
          echo "MUTATION_SHARD=${{ matrix.shard }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth time

      - name: Install dependencies
        run: uv pip install --editable '.[dev,mutation]'

      - name: Identify compatible mutation state
        id: mutation_state
        shell: bash
        run: |
          # Mutmut invalidates changed functions; do not partition state by source revision.
          mutmut_version=$(python -c 'from importlib.metadata import version; print(version("mutmut"))')
          state_name="mutmut-state-${RUNNER_OS}-py311-v4-${mutmut_version}-${MUTATION_SHARD}"
          echo "cache_prefix=${state_name}-" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${state_name}" >> "$GITHUB_OUTPUT"
          echo "legacy_artifact_name=mutmut-state-${RUNNER_OS}-py311-v3-${mutmut_version}" >> "$GITHUB_OUTPUT"
          mkdir -p .cache/mutation
          # Include resolved transitive dependencies in Mutmut's invalidation checks.
          uv pip freeze | LC_ALL=C sort > .cache/mutation/dependencies.txt

      - name: Verify unmodified selected tests
        id: baseline
        shell: bash
        run: |
          mkdir -p .cache/mutation
          xvfb-run -a python - <<'PY' 2>&1 | tee .cache/mutation/baseline.log
          import json
          import tomllib
          from pathlib import Path
          from time import perf_counter

          import pytest

          started_at = perf_counter()
          exit_code = None
          try:
              with open("pyproject.toml", "rb") as config_file:
                  config = tomllib.load(config_file)["tool"]["mutmut"]
              exit_code = pytest.main([
                  *config["pytest_add_cli_args_test_selection"],
                  *config["pytest_add_cli_args"],
                  "--junit-xml=.cache/mutation/baseline.xml",
                  "--durations=50", "--durations-min=0.1",
              ])
          finally:
              Path(".cache/mutation/baseline-timing.json").write_text(json.dumps({
                  "wall_seconds": perf_counter() - started_at,
                  "exit_code": exit_code,
              }))
          raise SystemExit(exit_code)
          PY

      - name: Restore mutation state
        id: restore_mutation_state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mutants/**/*.meta
            mutants/mutmut-stats.json
          key: ${{ steps.mutation_state.outputs.cache_prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.mutation_state.outputs.cache_prefix }}

      - name: Find previous mutation artifact
        id: previous_mutation_artifact
        if: steps.restore_mutation_state.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ARTIFACT_NAME: ${{ steps.mutation_state.outputs.artifact_name }}
          LEGACY_STATE_ARTIFACT_NAME: ${{ steps.mutation_state.outputs.legacy_artifact_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def previous_artifacts():
              next_url = url
              while next_url:
                  with urlopen(Request(next_url, headers=headers), timeout=30) as response:
                      artifacts = json.load(response)["artifacts"]
                      next_url = response.headers.get("Link", "")
                  next_url = next((
                      link.split(";")[0].strip().strip("<>")
                      for link in next_url.split(",") if 'rel="next"' in link
                  ), None)
                  yield from artifacts

          candidates = []
          for artifact in previous_artifacts():
              if artifact["name"] not in {os.environ["STATE_ARTIFACT_NAME"], os.environ["LEGACY_STATE_ARTIFACT_NAME"]}:
                  continue
              run = artifact.get("workflow_run") or {}
              if artifact["expired"] or run.get("head_branch") != os.environ["GITHUB_REF_NAME"]:
                  continue
              if str(run.get("id")) == os.environ["GITHUB_RUN_ID"]:
                  continue
              candidates.append(artifact)
          artifact = next((item for item in candidates if item["name"] == os.environ["STATE_ARTIFACT_NAME"]), None)
          artifact = artifact or (candidates[0] if candidates else None)
          if artifact:
              run = artifact["workflow_run"]
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  print(f"artifact_id={artifact['id']}", file=output)
                  print(f"run_id={run['id']}", file=output)
                  print(f"artifact_name={artifact['name']}", file=output)
              print(f"Found mutation state in artifact {artifact['id']} from run {run['id']}")
          else:
              print("No previous mutation artifact is available; starting without saved state.")
          PY

      - name: Download previous mutation artifact
        if: steps.previous_mutation_artifact.outputs.artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.previous_mutation_artifact.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous_mutation_artifact.outputs.run_id }}
          path: ${{ runner.temp }}/mutation-previous

      - name: Restore mutation state from artifact
        if: steps.previous_mutation_artifact.outputs.artifact_id != ''
        shell: bash
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
          LEGACY_STATE_ARTIFACT_NAME: ${{ steps.mutation_state.outputs.legacy_artifact_name }}
          RESTORED_ARTIFACT_NAME: ${{ steps.previous_mutation_artifact.outputs.artifact_name }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from runpy import run_path

          # The state-only artifact is rooted at the common upload ancestor: mutants/.
          source_root = Path(os.environ["RUNNER_TEMP"]) / "mutation-previous"
          state_files = (*source_root.rglob("*.meta"), source_root / "mutmut-stats.json")
          sharder = run_path(".github/scripts/mutation_shard.py")
          target_paths = set(sharder["targets_for_shard"](os.environ["MUTATION_SHARD"]))
          legacy = os.environ["RESTORED_ARTIFACT_NAME"] == os.environ["LEGACY_STATE_ARTIFACT_NAME"]
          restored = 0
          for source in state_files:
              if not source.is_file():
                  continue
              relative = source.relative_to(source_root).as_posix()
              if source.name != "mutmut-stats.json" and relative.removesuffix(".meta") not in target_paths:
                  continue
              target = Path("mutants") / source.relative_to(source_root)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              restored += 1
          provenance = "legacy unsharded" if legacy else "same-shard"
          print(f"Restored {restored} {provenance} state files for {os.environ['MUTATION_SHARD']}.")
          PY

      - name: Run mutation suite
        id: mutation_run
        timeout-minutes: 310
        shell: bash
        run: |
          # Clean-test and framework failures fail this step.
          # Per-mutant survivors, timeouts, and crashes are reported for review.
          remaining=$(( MUTATION_CUTOFF - $(date +%s) ))
          if (( remaining <= 0 )); then
            echo "No time remains to run mutation tests before the CI cutoff."
            exit 1
          fi
          started_at=$(date +%s)
          set +e
          /usr/bin/time --verbose --output=.cache/mutation/resources.txt \
            timeout --signal=INT --kill-after=120s "${remaining}s" \
            xvfb-run -a python .github/scripts/mutation_shard.py "$MUTATION_SHARD" 2>&1 | tee .cache/mutation/run.log
          statuses=( "${PIPESTATUS[@]}" )
          set -e
          python - "$started_at" "${statuses[0]}" "${statuses[1]}" <<'PY'
          import json
          import sys
          import time
          from pathlib import Path

          started_at, exit_code, log_exit_code = map(int, sys.argv[1:])
          Path(".cache/mutation/run-timing.json").write_text(json.dumps({
              "started_at": started_at,
              "wall_seconds": time.time() - started_at,
              "exit_code": exit_code,
              "log_exit_code": log_exit_code,
              "cutoff_reached": exit_code == 124,
              "terminated_by_sigkill": exit_code == 137,
              "max_children": 2,
          }))
          PY
          if (( statuses[0] == 124 )); then
            echo "Mutation run stopped at the CI cutoff; completed results will be cached."
            exit "${statuses[1]}"
          fi
          if (( statuses[0] != 0 )); then
            exit "${statuses[0]}"
          fi
          exit "${statuses[1]}"

      - name: Discard incomplete mutation state files
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state_dir = Path("mutants")
          discarded = []
          for path in (*state_dir.rglob("*.meta"), state_dir / "mutmut-stats.json"):
              if not path.is_file():
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, UnicodeDecodeError):
                  path.unlink()
                  discarded.append(str(path))
                  print(f"Discarded incomplete mutation state: {path}")
          report_dir = Path(".cache/mutation")
          report_dir.mkdir(parents=True, exist_ok=True)
          (report_dir / "discarded-state.json").write_text(json.dumps(discarded))
          PY

      - name: Save mutation state
        if: always() && hashFiles('mutants/**/*.meta') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mutants/**/*.meta
            mutants/mutmut-stats.json
          key: ${{ steps.mutation_state.outputs.cache_prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation state
        if: always() && hashFiles('mutants/**/*.meta') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.mutation_state.outputs.artifact_name }}
          path: |
            mutants/**/*.meta
            mutants/mutmut-stats.json
          if-no-files-found: error
          retention-days: 15

      - name: Report mutation results
        if: always()
        shell: bash
        run: |
          if [ -d mutants ] && command -v mutmut >/dev/null; then
            mutmut results --all true | tee .cache/mutation/results.txt
          fi

      - name: Collect mutation timing and diagnostics
        if: always()
        shell: bash
        env:
          MUTATION_CACHE_KEY: ${{ steps.restore_mutation_state.outputs.cache-matched-key }}
          MUTATION_PREVIOUS_ARTIFACT_ID: ${{ steps.previous_mutation_artifact.outputs.artifact_id }}
          MUTATION_BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          MUTATION_RUN_OUTCOME: ${{ steps.mutation_run.outcome }}
        run: python .github/scripts/mutation_report.py

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-py311-${{ matrix.shard }}
          path: |
            .cache/mutation/
          include-hidden-files: true
          if-no-files-found: warn
          # Retain measurements across several weekly runs for shard planning.
          retention-days: 90
