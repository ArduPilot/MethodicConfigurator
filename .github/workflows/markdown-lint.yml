name: Markdown

on:
  push:
    paths:
      - '**/*.md'        # Watch for changes in any markdown files
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lint markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'
