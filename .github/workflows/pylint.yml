name: Pylint

on:
  pull_request:
    paths:
      - '**/*.py'        # Watch for changes in any Python files
      - 'pyproject.toml' # Watch for changes in the pyproject.toml file
  push:
    paths:
      - '**/*.py'        # Watch for changes in any Python files
      - 'pyproject.toml' # Watch for changes in the pyproject.toml file
  workflow_dispatch:

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.11", "3.15.2"]

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # https://docs.astral.sh/uv/guides/integration/github/
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true

    - name: Install dependencies
      # these extra packages are required by pylint to validate the python imports
      run: |
        uv pip install .[dev,scripts,pypi_dist,linux_dist]

    - name: Install ty dependency
      run: |
        uv pip install ty

    - name: Analyze the code with ty
      run: |
        ty check

    - name: Analyze the code with pylint
      run: |
        pylint $(git ls-files '**/*.py')
