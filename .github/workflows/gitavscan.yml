name: gitavscan

on:
  push:
    paths:
      - '**/*.py'        # Watch for changes in any Python files
  release:
    types: [published]

permissions:
  contents: read  # Default limited permission

jobs:
  gitavscan:
    runs-on: ubuntu-latest
    name: AV scan

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup ClamAV configuration
      run: |
        sudo mkdir -p /etc/clamav
        echo 'TCPSocket 3310
        TCPAddr 127.0.0.1
        LocalSocket /var/run/clamav/clamd.sock
        User clamav
        LogFile /var/log/clamav/clamav.log
        LogTime yes
        LogVerbose yes
        PidFile /var/run/clamav/clamd.pid' | sudo tee /etc/clamav/clamd.conf
        sudo chmod 644 /etc/clamav/clamd.conf

    - name: Git AV Scan
      uses: djdefi/gitavscan@29c1c064ea648b71188b5c8155caef84ee50367b # main
